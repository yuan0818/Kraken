name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://platform:ci-postgres-fixture@127.0.0.1:56432/platform
      TEST_DATABASE_URL: postgresql+psycopg://platform:ci-postgres-fixture@127.0.0.1:56432/platform
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: ci-postgres-fixture
          POSTGRES_DB: platform
        ports: ["56432:5432"]
        options: --health-cmd "pg_isready -U platform -d platform" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.13.4"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install -g pnpm@11.25.0
      - run: uv sync --frozen --all-packages
      - run: uv run python scripts/check_release.py
      - run: uv run ruff check apps packages tests migrations scripts
      - run: uv run ruff format --check apps packages tests migrations scripts
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
      - run: pnpm install --frozen-lockfile
      - run: uv run python scripts/export_contracts.py
      - run: pnpm exec openapi-typescript contracts/generated/openapi.json -o packages/web-api-client/src/schema.d.ts
      - run: git diff --exit-code -- contracts/generated packages/web-api-client/src/schema.d.ts
      - run: pnpm build
