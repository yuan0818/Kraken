name: kraken-m0
services:
  postgres:
    image: docker.io/library/postgres:18.6
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: platform
    ports: ["127.0.0.1:56432:5432"]
    volumes: ["platform_pg:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 3s
      timeout: 3s
      retries: 30
  rabbitmq-permissions:
    image: docker.io/library/rabbitmq:4.2.1-management
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 999:999 /var/lib/rabbitmq"]
    volumes: ["platform_mq:/var/lib/rabbitmq"]
  rabbitmq:
    user: "999:999"
    depends_on:
      rabbitmq-permissions:
        condition: service_completed_successfully
    image: docker.io/library/rabbitmq:4.2.1-management
    environment:
      RABBITMQ_DEFAULT_USER: platform
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?required}
      RABBITMQ_DEFAULT_VHOST: platform
    ports: ["127.0.0.1:56732:5672", "127.0.0.1:56733:15672"]
    volumes: ["platform_mq:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  platform_pg:
  platform_mq:
