[project]
name = "platform-control-plane"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    'fastapi>=0.115,<1',
    'uvicorn[standard]>=0.34,<1',
    'sqlalchemy>=2.0,<2.1',
    'psycopg[binary]>=3.2,<4',
    'alembic>=1.15,<2',
    'celery>=5.5,<6',
    'platform-contracts',
    'platform-identity',
    "openpyxl>=3.1.5,<4",
    "defusedxml>=0.7.1,<1",
    "cryptography>=46,<50",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane"]
