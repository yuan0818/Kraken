[project]
name = "platform-node-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    'httpx>=0.28,<1',
    'websockets>=15,<16',
    'platform-contracts',
    "av>=16,<17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/node_agent"]
